name: DevCycle 3b — Second opinion

# A second PR review from a different model family, via OpenRouter. Manual
# only since #1431: DevCycle 3c — Risk review now runs it automatically for
# medium- and high-risk PRs. Use this to re-run it by hand. Posts a COMMENT
# review whose verdict gates the merge of a medium- or high-risk PR (#1481):
# the gate takes the worst verdict on the head commit, so a re-run here can
# replace an unclear or failed review but not overrule a request-changes.
#
# Requires: secret OPENROUTER_API_KEY. Optional: variable SECOND_REVIEW_MODEL
# (an OpenRouter model id, e.g. google/gemini-2.5-pro). Without the secret the
# job logs why and exits green, so forks and local runs don't break.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review (e.g. 123). Leave blank to skip.'
        required: false
        type: string

concurrency:
  group: second-opinion-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  second-opinion:
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'

      - name: Find PR number
        id: find-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.pr_number }}" ]; then
            echo "pr_number=${{ inputs.pr_number }}" >> $GITHUB_OUTPUT
          else
            PR_NUMBER=$(gh api \
              "repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/pulls" \
              --jq '.[0].number // empty')
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          fi

      - name: Check if PR is draft
        if: steps.find-pr.outputs.pr_number != ''
        id: check-draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IS_DRAFT=$(gh pr view ${{ steps.find-pr.outputs.pr_number }} --json isDraft --jq '.isDraft')
          echo "is_draft=$IS_DRAFT" >> $GITHUB_OUTPUT

      - name: Second-opinion review
        if: steps.find-pr.outputs.pr_number != '' && steps.check-draft.outputs.is_draft != 'true'
        env:
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:   ${{ github.repository }}
          OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
          SECOND_REVIEW_MODEL: ${{ vars.SECOND_REVIEW_MODEL }}
        run: node .github/scripts/run-second-review.js --pr ${{ steps.find-pr.outputs.pr_number }}
