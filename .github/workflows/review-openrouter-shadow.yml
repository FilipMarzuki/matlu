name: Review — OpenRouter (shadow)

# Shadow reviewer: runs the OpenRouter/DeepSeek reviewer ALONGSIDE
# "DevCycle 3 — Review" for signal comparison. It only posts an advisory
# comment (REVIEW_MODE=shadow) and never submits a GitHub review, so it does
# NOT affect the DevCycle 4 — Merge gate. When its verdicts track the Claude
# reviewer's, flip REVIEW_MODE to 'live' (and retire the Claude review step).
#
# Requires secret: OPENROUTER_API_KEY.

on:
  workflow_run:
    workflows: ["DevCycle 2 — CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review (e.g. 123).'
        required: false
        type: string
      model:
        description: 'OpenRouter model (default deepseek/deepseek-chat).'
        required: false
        type: string

concurrency:
  group: or-review-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'

      - name: Find PR number
        id: find-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.pr_number }}" ]; then
            echo "pr_number=${{ inputs.pr_number }}" >> $GITHUB_OUTPUT
          else
            PR_NUMBER=$(gh api \
              "repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/pulls" \
              --jq '.[0].number // empty')
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          fi

      - name: Run OpenRouter reviewer (shadow)
        if: steps.find-pr.outputs.pr_number != ''
        continue-on-error: true   # shadow must never fail the pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:  ${{ github.repository }}
          PR_NUMBER:          ${{ steps.find-pr.outputs.pr_number }}
          OPENROUTER_MODEL:   ${{ inputs.model || 'deepseek/deepseek-chat' }}
          REVIEW_MODE:        shadow
        run: node .github/scripts/openrouter-review.mjs
