name: DevCycle 3 — Review

# Per-PR review agent. Fires when CI passes on a PR, reviews the diff,
# and either approves or requests changes. DevCycle 4 — Merge chains
# off this workflow and only merges approved PRs.
#
# Who starts DevCycle 4 afterwards (#1582):
#   - started by CI passing (workflow_run): DevCycle 4's own workflow_run trigger.
#   - started by workflow_dispatch (DevCycle 3c does this when a PR is marked
#     ready after CI already passed): GitHub creates no workflow_run event for a
#     run started with GITHUB_TOKEN, so nothing would chain off this one. The
#     start-merge job starts DevCycle 4 itself. That covers a low-risk PR (3c starts
#     no merge for those) and a review that approves after 3c's paid reviews
#     finished (3c's own start of DevCycle 4 came too early). DevCycle 4 checks
#     approval and the gate itself, so an extra start never merges early.

on:
  workflow_run:
    workflows: ["DevCycle 2 — CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review (e.g. 123). Leave blank to skip.'
        required: false
        type: string

concurrency:
  group: review-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Only run when CI passed on a pull_request event (not direct pushes to main)
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # For start-merge below (#1582).
    outputs:
      pr_number: ${{ steps.find-pr.outputs.pr_number }}
      is_draft: ${{ steps.check-draft.outputs.is_draft }}
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ci-placeholder-not-a-real-key
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'

      - name: Find PR number
        id: find-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.pr_number }}" ]; then
            echo "pr_number=${{ inputs.pr_number }}" >> $GITHUB_OUTPUT
          else
            PR_NUMBER=$(gh api \
              "repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/pulls" \
              --jq '.[0].number // empty')
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          fi

      - name: Skip if no PR found
        if: steps.find-pr.outputs.pr_number == ''
        run: echo "No PR found for this commit — skipping review."

      - name: Check if PR is draft
        if: steps.find-pr.outputs.pr_number != ''
        id: check-draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IS_DRAFT=$(gh pr view ${{ steps.find-pr.outputs.pr_number }} --json isDraft --jq '.isDraft')
          echo "is_draft=$IS_DRAFT" >> $GITHUB_OUTPUT

      - name: Run review agent
        if: steps.find-pr.outputs.pr_number != '' && steps.check-draft.outputs.is_draft != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_PERSONAL }}
          GITHUB_TOKEN:            ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN:                ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ steps.find-pr.outputs.pr_number }}
          PROMPT=$(cat .agents/review.md | sed "s/{{pr_number}}/$PR_NUMBER/g")
          npx --yes @anthropic-ai/claude-code --print \
            --permission-mode bypassPermissions \
            "$PROMPT"

      # Pass the PR number to DevCycle 4 — Merge via artifact, because
      # workflow_run chains lose the original head_sha (Merge would see
      # main's HEAD instead of the PR branch tip).
      - name: Save PR number for Merge
        if: steps.find-pr.outputs.pr_number != ''
        run: |
          mkdir -p /tmp/review-result
          echo "${{ steps.find-pr.outputs.pr_number }}" > /tmp/review-result/pr_number

      - uses: actions/upload-artifact@v7
        if: steps.find-pr.outputs.pr_number != ''
        with:
          name: review-result
          path: /tmp/review-result/pr_number
          retention-days: 1

  # A dispatched review's completion triggers nothing (see the top of this file), so start
  # DevCycle 4 here (#1582). Its own job, so `actions: write` never reaches the review agent
  # above, which reads untrusted PR content with the token in its environment. With GITHUB_TOKEN:
  # a workflow_dispatch it sends does start a run. A failed dispatch is logged and the run stays
  # green: the review stands, and the merge can still be started by hand.
  start-merge:
    needs: review
    if: github.event_name == 'workflow_dispatch' && needs.review.outputs.pr_number != '' && needs.review.outputs.is_draft != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start DevCycle 4 — Merge
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.review.outputs.pr_number }}
        run: gh workflow run auto-merge.yml --repo "${{ github.repository }}" -f pr_number="$PR_NUMBER"
