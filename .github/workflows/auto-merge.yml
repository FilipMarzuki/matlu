name: DevCycle 4 — Merge

# Squash-merges a PR after the Review agent completes — but only if the
# PR has been approved. This ensures every merge goes through CI + Review.
# Also started by DevCycle 3c with a PR number when a medium- or high-risk
# PR's model reviews have finished (#1481), so a merge isn't stranded when the
# Review agent approved before they posted.
on:
  workflow_run:
    workflows: ["DevCycle 3 — Review"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to merge if it passes every gate'
        required: true
        type: string

jobs:
  auto-merge:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
      contents: write
    steps:
      # Download the PR number from the Review artifact instead of looking
      # it up by commit SHA — workflow_run chains lose the original head_sha
      # (we'd see main's HEAD, not the PR branch tip).
      - name: Download PR number from Review
        id: find-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.pr_number }}" ]; then
            echo "pr_number=${{ inputs.pr_number }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Download the review-result artifact from the triggering Review run
          RUN_ID=${{ github.event.workflow_run.id }}
          ARTIFACT_URL=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "review-result") | .archive_download_url' 2>/dev/null || true)

          if [ -n "$ARTIFACT_URL" ]; then
            gh api "$ARTIFACT_URL" > /tmp/artifact.zip
            unzip -o /tmp/artifact.zip -d /tmp/review-result
            PR_NUMBER=$(cat /tmp/review-result/pr_number)
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
            echo "Found PR #$PR_NUMBER from Review artifact"
          else
            echo "No review-result artifact found — Review may have skipped"
          fi

      - name: Check for approval
        if: steps.find-pr.outputs.pr_number != ''
        id: check-approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APPROVED=$(gh api \
            "repos/${{ github.repository }}/pulls/${{ steps.find-pr.outputs.pr_number }}/reviews" \
            --jq '[.[] | select(.state == "APPROVED")] | length')
          echo "approved=$APPROVED" >> $GITHUB_OUTPUT
          if [ "$APPROVED" -gt 0 ]; then
            echo "PR #${{ steps.find-pr.outputs.pr_number }} is approved"
          else
            echo "PR #${{ steps.find-pr.outputs.pr_number }} is NOT approved — skipping merge"
          fi

      # The merge gate (#1431, #1481): CI passed on the head commit, and the
      # risk tier's review models agree on it — medium: the second opinion
      # approves; high: + every focused lens finds nothing.
      # Scored here from main's rules rather than read from the risk:* label,
      # so a merge can't slip through before DevCycle 3c has labelled the PR.
      - uses: actions/checkout@v7
        if: steps.find-pr.outputs.pr_number != '' && steps.check-approval.outputs.approved > 0

      - name: Merge gate
        if: steps.find-pr.outputs.pr_number != '' && steps.check-approval.outputs.approved > 0
        id: risk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        # Exit 3 = hold: not a failure, so the run stays green; merge=false skips the merge.
        run: node .github/scripts/risk-score.mjs --pr ${{ steps.find-pr.outputs.pr_number }} --gate || [ $? -eq 3 ]

      - name: Squash-merge PR
        if: steps.find-pr.outputs.pr_number != '' && steps.check-approval.outputs.approved > 0 && steps.risk.outputs.merge == 'true'
        env:
          # Use GH_TRACKER_TOKEN (PAT) so the merge fires the workflow_run
          # event Bender / Marvin listen for. GitHub suppresses workflow_run
          # triggers for actions performed with the built-in GITHUB_TOKEN
          # (anti-recursion safeguard) — same reason agent-nightly checks out
          # with GH_TRACKER_TOKEN on the push side.
          GH_TOKEN: ${{ secrets.GH_TRACKER_TOKEN }}
        run: |
          echo "Merging PR #${{ steps.find-pr.outputs.pr_number }}"
          gh pr merge ${{ steps.find-pr.outputs.pr_number }} \
            --squash \
            --delete-branch \
            --repo ${{ github.repository }}
