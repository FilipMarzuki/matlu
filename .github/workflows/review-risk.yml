name: DevCycle 3c — Risk review

# Risk-based review routing (#1431). A script — not a model — scores each PR
# from the paths it touches, its size and whether code changed without tests
# (rules: .github/review-risk.json), labels it risk:low / risk:medium / risk:high
# and comments the reasons. The tier decides how much review it gets:
#
#   low     DevCycle 3 — Review only (the Claude review agent)
#   medium  + a second opinion from another model family (REVIEW_MODEL_MEDIUM)
#   high    + one focused pass per lens (determinism, saves, general) on a
#             stronger model (REVIEW_MODEL_HIGH), and DevCycle 4 waits for a
#             human to add the `human-approved` label before merging
#
# Triggers:
#   - CI passed on a non-draft PR             → score + paid reviews
#   - a PR is marked ready for review         → score + paid reviews, and start
#     DevCycle 3 — Review (marking ready doesn't re-run CI, so nothing else would)
#   - the `human-approved` label is added     → start DevCycle 3 — Review again,
#     so its approval reaches DevCycle 4 and the merge goes ahead
#   - workflow_dispatch with a PR number      → score + paid reviews
#
# Safety: every job checks out the BASE branch, never the PR's code, so a PR
# can't change the rules it is scored by. Paid model calls only run for PRs
# from this repo, never from forks.
#
# Requires: secret OPENROUTER_API_KEY (without it the review steps log why and
# exit green). Optional variables: REVIEW_MODEL_MEDIUM, REVIEW_MODEL_HIGH
# (OpenRouter model ids). Optional secret GH_TRACKER_TOKEN for starting the
# Review workflow (falls back to GITHUB_TOKEN).

on:
  workflow_run:
    workflows: ["DevCycle 2 — CI"]
    types: [completed]
  pull_request:
    types: [ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to score and review (e.g. 123)'
        required: true
        type: string

concurrency:
  group: risk-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.run_id }}-${{ github.event.action || 'run' }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write

jobs:
  score:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action == 'ready_for_review' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr_number: ${{ steps.find-pr.outputs.pr_number }}
      tier: ${{ steps.score.outputs.tier }}
      lenses: ${{ steps.score.outputs.lenses }}
      same_repo: ${{ steps.score.outputs.same_repo }}
      draft: ${{ steps.score.outputs.draft }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The base branch's rules and scripts, never the PR's own.
          ref: ${{ github.event.pull_request.base.sha || '' }}

      - uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'

      - name: Find PR number
        id: find-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PR: ${{ inputs.pr_number }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR="${INPUT_PR:-$EVENT_PR}"
          if [ -z "$PR" ] && [ -n "$HEAD_SHA" ]; then
            PR=$(gh api "repos/${{ github.repository }}/commits/$HEAD_SHA/pulls" --jq '.[0].number // empty')
          fi
          echo "pr_number=$PR" >> "$GITHUB_OUTPUT"

      - name: Score, label and comment
        id: score
        if: steps.find-pr.outputs.pr_number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # Drafts get scored when they're marked ready, not on every push.
          DRAFT=$(gh api "repos/${{ github.repository }}/pulls/${{ steps.find-pr.outputs.pr_number }}" --jq '.draft' 2>/dev/null || echo false)
          if [ "$DRAFT" = "true" ]; then
            echo "PR is a draft — skipping"; echo "draft=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          node .github/scripts/risk-score.mjs --pr ${{ steps.find-pr.outputs.pr_number }} --apply

      - name: Start DevCycle 3 — Review (marked ready)
        if: github.event.action == 'ready_for_review'
        env:
          GH_TOKEN: ${{ secrets.GH_TRACKER_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run review-agent.yml --repo ${{ github.repository }} \
            -f pr_number=${{ steps.find-pr.outputs.pr_number }}

  second-opinion:
    needs: score
    if: >
      needs.score.outputs.draft != 'true' &&
      needs.score.outputs.same_repo == 'true' &&
      (needs.score.outputs.tier == 'medium' || needs.score.outputs.tier == 'high')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || '' }}
      - uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
      - name: Second-opinion review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SECOND_REVIEW_MODEL: ${{ vars.REVIEW_MODEL_MEDIUM || vars.SECOND_REVIEW_MODEL || 'google/gemini-2.5-pro' }}
        run: node .github/scripts/run-second-review.js --pr ${{ needs.score.outputs.pr_number }}

  focused:
    needs: score
    if: >
      needs.score.outputs.draft != 'true' &&
      needs.score.outputs.same_repo == 'true' &&
      needs.score.outputs.tier == 'high'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lens: ${{ fromJSON(needs.score.outputs.lenses) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || '' }}
      - uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
      - name: Focused review — ${{ matrix.lens }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SECOND_REVIEW_MODEL: ${{ vars.REVIEW_MODEL_HIGH || 'openai/gpt-5' }}
        run: node .github/scripts/run-second-review.js --pr ${{ needs.score.outputs.pr_number }} --focus ${{ matrix.lens }}

  # A human approved a high-risk PR: run the Review agent again so its approval
  # reaches DevCycle 4, which now sees the label and merges.
  human-approved:
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'human-approved' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start DevCycle 3 — Review
        env:
          GH_TOKEN: ${{ secrets.GH_TRACKER_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run review-agent.yml --repo ${{ github.repository }} \
            -f pr_number=${{ github.event.pull_request.number }}
