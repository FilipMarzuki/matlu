<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Silkscreen:wght@400;700&family=Chakra+Petch:wght@400;500;600;700&display=swap"
    />
    <title>Core Warden — Crafting Lab</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d0e1a;
        overflow: hidden;
      }
      #game-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100%;
      }
      /* Nudge phone users toward landscape — the crafting UI is designed wide. */
      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px;
        background: #0d0e1a;
        color: #9090a8;
        font-family: "Chakra Petch", sans-serif;
        font-size: 15px;
        line-height: 1.6;
      }
      @media (orientation: portrait) and (max-width: 820px) {
        #rotate-hint {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="rotate-hint">
      <div>
        <div style="font-family: 'Silkscreen', monospace; color: #ffe066; font-size: 18px; margin-bottom: 10px">
          ⚒ CRAFTING LAB
        </div>
        Rotate your device to landscape<br />for the best view of the crafting menus.
      </div>
    </div>
    <script type="module" src="/src/crafting.ts"></script>
  </body>
</html>
